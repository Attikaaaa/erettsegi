<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Érettségi</title>
  <meta name="description" content="Tételek, amiket tényleg meg lehet tanulni." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='500' fill='white' text-anchor='middle'%3E%C3%89%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@300;400;600&family=Geist+Mono:wght@400;500&display=swap" />
  <script>
    try { var t = localStorage.getItem("erettsegi:theme"); t = t && JSON.parse(t); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>

<style>
:root{--bg:#fdfcfc;--card:#fff;--ink:#000;--ink-3:#777169;--line:rgba(0,0,0,.08);--bad:#c0392b;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--card:#181818;--ink:#fff;--ink-3:#9a948c;--line:rgba(255,255,255,.1);--bad:#ff7b6b;--on:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--card:#181818;--ink:#fff;--ink-3:#9a948c;--line:rgba(255,255,255,.1);--bad:#ff7b6b;--on:#000;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
#lock{min-height:100vh;display:grid;place-items:center;padding:0 16px}
#lock form{width:100%;max-width:360px;display:grid;gap:14px}
#lock .orb{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb38a,#ff6a2b 55%,#b23d12);margin-bottom:8px}
#lock h1{font:300 40px/1.1 "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 10px}
#lock input{font:inherit;padding:14px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
#lock input:focus{border-color:var(--ink)}
#lock button{font:500 16px Inter,system-ui,sans-serif;padding:14px 18px;border-radius:999px;border:0;background:var(--ink);color:var(--on);cursor:pointer}
#lock button:disabled{opacity:.5;cursor:default}
#lock .msg{min-height:1.5em;font-size:14px;color:var(--bad)}
#lock .msg.wait{color:var(--ink-3)}
</style>
</head>
<body>
<div id="lock" hidden>
  <form autocomplete="on">
    <div class="orb" aria-hidden="true"></div>
    <h1>Érettségi</h1>
    <input type="password" name="password" autocomplete="current-password" placeholder="Jelszó" aria-label="Jelszó" required autofocus>
    <button type="submit">Belépés</button>
    <div class="msg" role="status"></div>
  </form>
</div>
<div id="root"></div>
<script>
(function () {
  var M = {"salt":"z4ZAR2wyYK/oU0+gNyPYAw==","iter":1000000,"base":"/erettsegi/","store":"erettsegi:vault"}, T = {"working":"Feloldás…","wrong":"Hibás jelszó.","failed":"Nem sikerült betölteni. Frissítsd az oldalt."};
  var S = crypto.subtle, b64d = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  function get(u) { return fetch(M.base + u).then(function (r) { if (!r.ok) throw new Error("net"); return r.arrayBuffer(); }); }
  function dec(k, buf) { var u = new Uint8Array(buf); return S.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, k, u.slice(12)); }
  function derive(pw) {
    return S.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (m) {
      return S.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64d(M.salt), iterations: M.iter }, m, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function save(k) { S.exportKey("raw", k).then(function (r) { try { localStorage.setItem(M.store, btoa(String.fromCharCode.apply(null, new Uint8Array(r)))); } catch (e) {} }); }
  function forget() { try { localStorage.removeItem(M.store); } catch (e) {} }
  function blobUrl(k, man, u) { return get(man.files[u]).then(function (b) { return dec(k, b); }).then(function (p) { return URL.createObjectURL(new Blob([p], { type: man.types[u] })); }); }
  // a jegyzék dekódolása egyben a jelszó ellenőrzése is (GCM: rossz kulcsnál hiba)
  function unlock(k) {
    return get("m.bin").then(function (b) {
      return dec(k, b).then(function (p) { return JSON.parse(new TextDecoder().decode(p)); }, function () { throw new Error("key"); });
    }).then(function (man) {
      var memo = {};
      window.__vaultAsset = function (u) { return man.files[u] ? (memo[u] = memo[u] || blobUrl(k, man, u)) : Promise.resolve(u); };
      return Promise.all(man.styles.map(function (u) {
        return blobUrl(k, man, u).then(function (h) { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = h; document.head.appendChild(l); });
      })).then(function () { return blobUrl(k, man, man.scripts[0]); }).then(function (js) {
        document.getElementById("lock").remove();
        var s = document.createElement("script"); s.type = "module"; s.src = js; document.body.appendChild(s);
      });
    });
  }
  var lock = document.getElementById("lock"), form = lock.querySelector("form"), msg = lock.querySelector(".msg"), btn = lock.querySelector("button"), inp = lock.querySelector("input");
  function show() { lock.hidden = false; inp.focus(); }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    btn.disabled = true; msg.className = "msg wait"; msg.textContent = T.working;
    derive(inp.value).then(function (k) { return unlock(k).then(function () { save(k); }); }).catch(function (err) {
      btn.disabled = false; msg.className = "msg"; msg.textContent = err && err.message === "key" ? T.wrong : T.failed;
      if (err && err.message === "key") { inp.select(); }
    });
  });
  var stored = null; try { stored = localStorage.getItem(M.store); } catch (e) {}
  if (!stored) return show();
  S.importKey("raw", b64d(stored), "AES-GCM", true, ["decrypt"]).then(unlock).catch(function () { forget(); show(); });
})();
</script>
</body>
</html>
